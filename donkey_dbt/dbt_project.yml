name: 'donkey_dbt'
version: '1.0.0'

# Profile in profiles.yml (dev = DuckDB, prod = BigQuery).
profile: 'donkey_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  donkey_dbt:
    # Write YAML descriptions into the warehouse (table + column descriptions)
    +persist_docs:
      relation: true
      columns: true
    # "+" configs apply to every model in the folder
    staging:
      +materialized: view
    marts:
      # Fallback only: each mart sets materialized='incremental' in its own config
      +materialized: table
