name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - run: uv sync --frozen
      - run: uv run ruff check.
      - run: uv run python donkey_pipeline.py
      - run: uv run dbt deps
        working-directory: donkey_dbt
      - run: uv run dbt build
        working-directory: donkey_dbt
