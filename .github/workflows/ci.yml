name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python donkey_pipeline.py
      - run: uv run dbt deps
        working-directory: donkey_dbt
      # Unit tests that use the "this" input need the model's table to exist.
      # CI starts with an empty DuckDB, so build first, then run unit tests.
      - run: uv run dbt build --exclude-resource-type unit_test
        working-directory: donkey_dbt
      - run: uv run dbt test --select test_type:unit
        working-directory: donkey_dbt
      - run: uv run dbt docs generate --static
        working-directory: donkey_dbt
      - name: Prepare docs site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir site
          cp donkey_dbt/target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5