    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "dlt[hub]>=1.32.0",
    "great-expectations>=1.25.0",
    "ibis-framework>=12.0.0",
    "marimo>=0.25.2",
    "pyarrow>=26.0.1",
    "pydbml>=1.2.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
    "streamlit>=1.67.0",
    "yamllint>=1.38.0",
]
