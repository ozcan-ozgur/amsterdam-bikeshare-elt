    "dbt-bigquery>=1.12.4",
    "dbt-duckdb>=1.11.1",
    "dlt[bigquery,duckdb,parquet]>=1.32.0",
    "google-cloud-bigquery>=3.47.0",
    "pandas>=3.1.1",
